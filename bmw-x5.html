.gallery{

.specs{

.spec{

}

.price{
    font-size:42px;
    color:#d4af37;
    font-weight:bold;
}

h1{
    margin-top:40px;
}

@media(max-width:900px){

.gallery{
grid-template-columns:repeat(2,1fr);
}

.specs{
grid-template-columns:repeat(2,1fr);
}

}
